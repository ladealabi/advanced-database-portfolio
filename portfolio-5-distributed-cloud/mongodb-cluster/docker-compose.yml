# Portfolio 5: MongoDB 3-node REPLICA SET for KoboTrust (run locally)

services:
  mongo1:
    image: mongo:7.0
    container_name: kt-mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes: ["mongo1-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10
  mongo2:
    image: mongo:7.0
    container_name: kt-mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27018:27017"]
    volumes: ["mongo2-data:/data/db"]
  mongo3:
    image: mongo:7.0
    container_name: kt-mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27019:27017"]
    volumes: ["mongo3-data:/data/db"]

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
